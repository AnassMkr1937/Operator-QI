version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: operatoriq-db
    environment:
      POSTGRES_USER: operatoriq
      POSTGRES_PASSWORD: operatoriq
      POSTGRES_DB: operatoriq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operatoriq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: operatoriq-backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://operatoriq:operatoriq@db:5432/operatoriq
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/code
      - ../data:/data
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: operatoriq-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
